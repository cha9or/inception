services:
  mariadb:
    container_name: mariadb
    init: true
    restart: on-failure
    env_file: .env
    build: requirements/mariadb
    volumes: 
      - mariadb:/var/lib/mysql
    networks: 
      - docker-network
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin", "-uroot", "-p$(cat /run/secrets/db_root_password)", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    container_name: nginx
    init: true
    restart: on-failure
    env_file: .env
    build: requirements/nginx
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    networks:
      - docker-network
    depends_on:
      - wordpress

  wordpress:
    container_name: wordpress
    init: true
    restart: on-failure
    env_file: .env
    build: requirements/wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - docker-network
    depends_on:
      - mariadb
    secrets:
      - db_password
      - wp_password
      - wp_admin_password

  adminer:
    container_name: adminer
    init: true
    restart: on-failure
    build: requirements/bonus/adminer
    networks:
      - docker-network
    ports:
      - "8080:8080"
    depends_on:
      - mariadb

  redis:
    container_name: redis
    init: true
    restart: on-failure
    build: requirements/bonus/redis
    networks:
      - docker-network

volumes:
  mariadb: {}
  wordpress: {}

networks:
  docker-network:
    name: docker-network
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_password:
    file: ../secrets/wp_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt